services:
  database:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-meeting_protocol_test}
    volumes:
      - database_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [meeting-protocol]

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["node", "dist/infrastructure/database/migrations/migrate.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MIGRATIONS_DIR: /app/database/migrations
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    networks: [meeting-protocol]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3000/api/v1/health'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [meeting-protocol]

  integration-test:
    profiles: [test]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_TEST_DB:-meeting_protocol_test}
      LOG_LEVEL: warn
      MIGRATIONS_DIR: /app/database/migrations
    depends_on:
      database:
        condition: service_healthy
    networks: [meeting-protocol]

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [meeting-protocol]

networks:
  meeting-protocol:
    name: meeting-protocol-network

volumes:
  database_data:
    name: meeting-protocol-database-data
